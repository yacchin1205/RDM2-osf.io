name: Unit Tests

on:
  push:
    branches-ignore:
      - '[0-9]*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        id: build
        run: |
          docker build -t rdm-osf-test:${{ github.sha }} -f ./Dockerfile .

      - name: Save Docker image
        run: |
          docker save rdm-osf-test:${{ github.sha }} -o /tmp/rdm-osf-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdm-osf-image
          path: /tmp/rdm-osf-image.tar
          retention-days: 1

      - name: Export image reference
        id: meta
        run: echo "image=rdm-osf-test:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test_build: [addons, website, api1_and_js, api2, api3_and_osf]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: rdm-osf-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/rdm-osf-image.tar

      - name: Run matrix job
        env:
          TEST_BUILD: ${{ matrix.test_build }}
          OSF_TEST_IMAGE: ${{ needs.build-image.outputs.image }}
          ENABLE_COVERAGE: ${{ github.event_name == 'pull_request' }}
        run: |
          bash .github/scripts/ci/run-tests.sh "$TEST_BUILD"

      - name: Upload coverage artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test_build }}
          path: .coverage.${{ matrix.test_build }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-comment-artifact:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true

      - name: Store PR coverage comment to be posted
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1
