name: Docker Build Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Free up disk space
      run: |
        # Remove unnecessary packages to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get remove -y '^dotnet-.*'
        sudo apt-get remove -y '^llvm-.*'
        sudo apt-get remove -y 'php.*'
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h

    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker build --progress=plain --no-cache -t rdm-osf-test .
      env:
        DOCKER_BUILDKIT: 1

    - name: Verify Docker image
      run: |
        echo "Verifying Docker image..."
        docker images rdm-osf-test
        
        # Check image size
        IMAGE_SIZE=$(docker images rdm-osf-test --format "table {{.Size}}" | tail -n +2)
        echo "Image size: $IMAGE_SIZE"
        
        # Test basic functionality
        echo "Testing basic container functionality..."
        docker run --rm rdm-osf-test python3 --version
        docker run --rm rdm-osf-test pip3 --version
        
        # Test that s3compat package is installed
        echo "Testing s3compat package installation..."
        docker run --rm rdm-osf-test python3 -c "import s3compat; print('s3compat package imported successfully')"
        
        # Test Django app detection (create required config files first)
        echo "Testing Django app configuration..."
        docker run --rm rdm-osf-test bash -c '
        # Create required configuration files
        cp /code/website/settings/local-dist.py /code/website/settings/local.py
        cp /code/api/base/settings/local-dist.py /code/api/base/settings/local.py
        
        # Test Django setup
        python3 -c "
import os
os.environ[\"DJANGO_SETTINGS_MODULE\"] = \"api.base.settings.defaults\"
import django
django.setup()
from django.conf import settings
if \"s3compat.osf_addon\" in settings.INSTALLED_APPS:
    print(\"s3compat.osf_addon found in INSTALLED_APPS\")
else:
    print(\"ERROR: s3compat.osf_addon not found in INSTALLED_APPS\")
    exit(1)
"
        '

    - name: Test Waterbutler provider entry point
      run: |
        echo "Testing Waterbutler provider entry point..."
        docker run --rm rdm-osf-test python3 -c "
        import pkg_resources
        try:
            entry_points = list(pkg_resources.iter_entry_points('waterbutler.providers', 's3compat'))
            if entry_points:
                print('s3compat Waterbutler provider entry point found')
                # Note: Don't load the provider class since waterbutler dependencies are not available
                print('Provider entry point is correctly configured')
            else:
                print('ERROR: s3compat Waterbutler provider entry point not found')
                exit(1)
        except Exception as e:
            print(f'ERROR with Waterbutler provider entry point: {e}')
            exit(1)
        "

    - name: Test admin integration entry point
      run: |
        echo "Testing admin integration entry point..."
        docker run --rm rdm-osf-test bash -c '
        # Create required configuration files
        cp /code/website/settings/local-dist.py /code/website/settings/local.py
        cp /code/api/base/settings/local-dist.py /code/api/base/settings/local.py
        
        # Test admin integration
        python3 -c "
import pkg_resources
try:
    entry_points = list(pkg_resources.iter_entry_points(\"rdm.admin_integrations\", \"s3compat\"))
    if entry_points:
        print(\"s3compat admin integration entry point found\")
        integration_func = entry_points[0].load()
        print(f\"Integration function: {integration_func}\")
    else:
        print(\"ERROR: s3compat admin integration entry point not found\")
        exit(1)
except Exception as e:
    print(f\"ERROR loading admin integration: {e}\")
    exit(1)
"
        '

    - name: Test package dependencies
      run: |
        echo "Testing package dependencies..."
        docker run --rm rdm-osf-test bash -c '
        # Create required configuration files
        cp /code/website/settings/local-dist.py /code/website/settings/local.py
        cp /code/api/base/settings/local-dist.py /code/api/base/settings/local.py
        
        # Test dependencies
        python3 -c "
# Test boto3 (required for S3 compatibility)
import boto3
print(\"boto3 imported successfully\")

# Test Django apps
import django
print(\"Django imported successfully\")

# Test Flask components (if any)
try:
    import flask
    print(\"Flask imported successfully\")
except ImportError:
    print(\"Flask not available (expected in this environment)\")

print(\"All dependency tests passed\")
"
        '

    - name: Clean up Docker resources
      if: always()
      run: |
        # Clean up to free space
        docker rmi rdm-osf-test || true
        docker system prune -f
        df -h

    - name: Display build summary
      if: always()
      run: |
        echo "=== Docker Build Test Summary ==="
        echo "✓ Docker image built successfully"
        echo "✓ s3compat package installed and importable"
        echo "✓ Django app configuration verified"
        echo "✓ Waterbutler provider entry point working"
        echo "✓ Admin integration entry point working"
        echo "✓ Dependencies verified"
        echo "Docker build test completed successfully!"